[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "seo-data-warehouse-starter"
version = "0.1.0"
description = "A reproducible PostgreSQL pipeline for synthetic SEO performance data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Vladimir Bazhenov" }]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
seo-warehouse = "seo_data_warehouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_data_warehouse"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
