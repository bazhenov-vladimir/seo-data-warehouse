services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_demo}
      POSTGRES_USER: ${POSTGRES_USER:-seo_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_demo_local_only}
      WAREHOUSE_READER_USER: ${WAREHOUSE_READER_USER:-seo_reader}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-seo_reader_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_views.sql:/docker-entrypoint-initdb.d/002_views.sql:ro
      - ./sql/003_reader.sh:/docker-entrypoint-initdb.d/003_reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo_demo} -d ${POSTGRES_DB:-seo_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_demo}
      POSTGRES_USER: ${POSTGRES_USER:-seo_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_demo_local_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GOOGLE_APPLICATION_CREDENTIALS: ${GSC_CREDENTIALS_FILE:-/app/credentials/gsc-service-account.json}
      GSC_SITE_CODE: ${GSC_SITE_CODE:-}
      GSC_SITE_NAME: ${GSC_SITE_NAME:-}
      GSC_PROPERTY: ${GSC_PROPERTY:-}
      GSC_LOOKBACK_DAYS: ${GSC_LOOKBACK_DAYS:-7}
      GSC_LAG_DAYS: ${GSC_LAG_DAYS:-3}
      GSC_SEARCH_TYPE: ${GSC_SEARCH_TYPE:-web}
    volumes:
      - ./data:/app/data:ro
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  gsc-scheduler:
    build:
      context: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          seo-warehouse import-gsc || echo 'GSC import failed; see the log above.';
          sleep "$${GSC_INTERVAL_SECONDS}";
        done
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_demo}
      POSTGRES_USER: ${POSTGRES_USER:-seo_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_demo_local_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GOOGLE_APPLICATION_CREDENTIALS: ${GSC_CREDENTIALS_FILE:-/app/credentials/gsc-service-account.json}
      GSC_SITE_CODE: ${GSC_SITE_CODE:-}
      GSC_SITE_NAME: ${GSC_SITE_NAME:-}
      GSC_PROPERTY: ${GSC_PROPERTY:-}
      GSC_LOOKBACK_DAYS: ${GSC_LOOKBACK_DAYS:-7}
      GSC_LAG_DAYS: ${GSC_LAG_DAYS:-3}
      GSC_SEARCH_TYPE: ${GSC_SEARCH_TYPE:-web}
      GSC_INTERVAL_SECONDS: ${GSC_INTERVAL_SECONDS:-86400}
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["gsc"]

  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${METABASE_DB_NAME:-metabase_app}
      POSTGRES_USER: ${METABASE_DB_USER:-metabase_app}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_app_local_only}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${METABASE_DB_USER:-metabase_app} -d ${METABASE_DB_NAME:-metabase_app}
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dashboard"]

  metabase:
    image: metabase/metabase:v0.64.1
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase_app}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase_app}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_app_local_only}
      MB_DB_HOST: metabase-db
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3000}
      MB_SESSION_SECRET_KEY: ${METABASE_SESSION_SECRET:-local_session_secret_2026}
      JAVA_TIMEZONE: UTC
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    profiles: ["dashboard"]

  metabase-provision:
    build:
      context: .
    entrypoint: ["python", "scripts/provision_metabase.py"]
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.local}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-local_admin_2026}
      METABASE_SITE_NAME: SEO Data Warehouse
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${POSTGRES_DB:-seo_demo}
      WAREHOUSE_READER_USER: ${WAREHOUSE_READER_USER:-seo_reader}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-seo_reader_local_only}
    depends_on:
      postgres:
        condition: service_healthy
      metabase:
        condition: service_healthy
    profiles: ["dashboard"]

volumes:
  postgres_data:
  metabase_data:
